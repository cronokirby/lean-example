name: Aeneas extraction

# Re-runs Charon and Aeneas with the pinned release and fails if the committed
# Lean in examples/lean-src/Examples/Gen differs from what they produce, so the
# proofs are known to be about the Rust code in the tree.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Must match the aeneas rev in examples/lean-src/lakefile.toml (checked below).
  AENEAS_RELEASE: nightly-2026.11.19-8f4466d

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check the release matches the Lean dependency
        run: grep -q "rev = \"${AENEAS_RELEASE##*-}" examples/lean-src/lakefile.toml

      - name: Install Aeneas and Charon
        run: |
          mkdir -p "$RUNNER_TEMP/aeneas"
          curl -fsSL "https://github.com/AeneasVerif/aeneas/releases/download/$AENEAS_RELEASE/aeneas-linux-x86_64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/aeneas"
          echo "$RUNNER_TEMP/aeneas" >> "$GITHUB_PATH"

      - name: Install the Rust nightly that Charon needs
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' "$RUNNER_TEMP/aeneas/rust-toolchain")
          rustup toolchain install "$channel" --profile minimal --component rustc-dev,llvm-tools,rust-src

      - name: Re-extract
        run: examples/lean-src/extract.sh

      - name: Check the committed extraction is unchanged
        run: |
          git status --porcelain -- examples/lean-src/Examples/Gen
          git diff -- examples/lean-src/Examples/Gen
          test -z "$(git status --porcelain -- examples/lean-src/Examples/Gen)"
